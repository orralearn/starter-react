# Made for you: on every push and pull request, GitHub checks your project
# (types, lint, tests, build). When main changes, it publishes the site.
# Once per repository: Settings -> Pages -> Source: GitHub Actions.
name: Check and publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push replaces a pull request's run; on main, a publish that started always finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint --if-present
      - run: npm test -- --run
      # The site lives at /<repository name>/ (or / for a <name>.github.io repository).
      - run: npm run build -- --base "$BASE"
        env:
          BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
      # A link to any page of your app (a refresh, a shared link) opens the app, not a 404.
      - run: cp dist/index.html dist/404.html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Only main publishes. Pull requests (also from forks) are checked, never published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
